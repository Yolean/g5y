# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/master/v1.27.9/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc
spec:
  replicas: 1
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65534
      shareProcessNamespace: true
      containers:
      - name: keycloak
        image: example.net/yolean/g5y-test-keycloak
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        - name: jgroups-tcp
          containerPort: 7600
        env:
        - name: JAVA_OPTS_APPEND
          value: -Djgroups.dns.query=keycloak-proxied-cluster
        - name: KC_DB_URL
          # UTF-8: https://www.keycloak.org/server/db#_configuring_unicode_support_for_a_mysql_database
          value: jdbc:mariadb://mysql:3306/keycloak?characterEncoding=UTF-8
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak
              key: sqlpassword
        # until we unwrap entrypoint
        - name: PRINT_ENV
          value: "true"
        - name: QUARKUS_HTTP_ACCESS_LOG_ENABLED
          value: "true"
        - name: QUARKUS_HTTP_ACCESS_LOG_PATTERN
          # REVIEW see https://quarkus.io/guides/http-reference#configuring-http-access-logs
          # response status, method, request relative path, request-id header
          value: "%s %m %R req_id=%{i,x-request-id}"
        - name: QUARKUS_HTTP_ACCESS_LOG_EXCLUDE_PATTERN
          value: "/auth/resources.*"
        args:
        - start
        # so we don't accidentally try rolling upgrade with db migration
        - --spi-connections-jpa-quarkus-migration-strategy=manual
        - --spi-connections-jpa-quarkus-migration-export=/migration/keycloak-database-update.sql
        # never run dev conf in production
        - --optimized
        # metrics settings, must match what's enabled in build time options
        - --http-metrics-slos=25,100,1000
        # startupProbe:
        #   httpGet:
        #     path: /health/started
        #     port: 8080
        readinessProbe:
          httpGet:
            path: /auth/health/ready
            port: 9000
        # livenessProbe:
        #   httpGet:
        #     path: /health/live
        #     port: 9000
        resources:
          requests:
            cpu: 50m
            memory: 550Mi
        volumeMounts:
        - name: config
          mountPath: /opt/keycloak/conf
        - name: migration
          mountPath: /migration
      volumes:
      - name: config
        configMap:
          name: keycloak-config
      - name: migration
        emptyDir: {}
